<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Golf Trip App</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme colour (Android Chrome toolbar, iOS status bar) -->
    <meta name="theme-color" content="#16a34a" />

    <!-- iOS / Safari PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Golf Trip" />
    <link rel="apple-touch-icon" href="/manus-storage/icon-192_2b0f52a2.png" />

    <!-- Standard favicon fallback -->
    <link rel="icon" type="image/png" href="/manus-storage/icon-192_2b0f52a2.png" />

    <!-- Description for share cards -->
    <meta name="description" content="Competitive golf trip management — live leaderboards, scoring, handicaps and achievement alerts." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
