<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golf Trip App — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050f05;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #16a34a;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="icon">⛳</div>
  <h1>You're Offline</h1>
  <p>No internet connection detected. Check your connection and try again — your scores and leaderboards will be waiting.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
